services:
  hub:
    build: .
    ports:
      # Host port is configurable; the container port is not. 8080 is a popular
      # default and is quite often already taken on a developer machine — this
      # was hardcoded, so `make dev` failed with a Docker networking error that
      # says nothing about which process holds the port or how to move ours.
      - '${AGENTBRIDGE_HOST_PORT:-8080}:8080'
    environment:
      # No default: a hub that accepted approvals against a placeholder owner
      # key would be worse than one that refuses to start.
      AGENTBRIDGE_OWNER_PUBLIC_KEY: ${AGENTBRIDGE_OWNER_PUBLIC_KEY:?run "agentbridge keygen --out owner.key" and put the printed public key here or in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DELIVERY_INTERVAL_MS: ${DELIVERY_INTERVAL_MS:-1000}
    volumes:
      - agentbridge-data:/data
    restart: unless-stopped

volumes:
  agentbridge-data:
